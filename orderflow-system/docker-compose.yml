services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ofx
      POSTGRES_DB: ofx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro   # 0001 core, 0002 hypertables
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ofx"], interval: 5s, retries: 10 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  api:
    build: ./backend
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]   # bound to localhost; put a TLS reverse proxy in front for remote access
volumes:
  dbdata:
