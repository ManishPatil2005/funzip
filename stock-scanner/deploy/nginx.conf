# Reverse proxy with TLS termination, rate limiting and header hygiene.
# Place fullchain.pem and privkey.pem in deploy/certs/ (see README).
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;

  server {
    listen 8080 default_server;
    server_name _;
    location /healthz { proxy_pass http://app:8000; }
    location / { return 301 https://$host$request_uri; }
  }

  # Reject requests addressed to an unknown host name or raw IP.
  server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 444;
  }

  server {
    listen 8443 ssl;
    http2 on;
    # Replace with your domain (must match SCANNER_DOMAIN in .env).
    server_name scanner.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_conn perip 20;

    # X-Forwarded-For is overwritten (never appended) so clients cannot spoof their address.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;

    location ~ /\. { deny all; }

    location = /api/scan {
      limit_req zone=scan burst=5 nodelay;
      proxy_pass http://app:8000;
      proxy_read_timeout 150s;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app:8000;
    }
  }
}
