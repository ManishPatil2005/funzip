services:
  app:
    build: .
    image: market-scanner:1.0.0
    env_file: .env
    environment:
      SCANNER_ENV: production
      SCANNER_DATABASE_PATH: /data/scanner.db
      SCANNER_HSTS: "true"
      SCANNER_TRUST_PROXY: "true"
      # The container health check calls 127.0.0.1, so keep it in the allowed hosts.
      SCANNER_ALLOWED_HOSTS: "${SCANNER_DOMAIN:?set SCANNER_DOMAIN in .env},127.0.0.1,localhost"
    volumes:
      - scanner-data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 200
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

volumes:
  scanner-data:
